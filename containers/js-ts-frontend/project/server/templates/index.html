<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS/TS Frontend</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 30px;
        }

        .projects {
            display: grid;
            gap: 12px;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .project a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 18px 20px;
            color: inherit;
            text-decoration: none;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .project a:hover {
            border-color: #999;
        }

        .project-name {
            font-weight: 600;
        }

        .project-date {
            color: #777;
            font-size: 14px;
            white-space: nowrap;
        }

        .empty {
            color: #777;
        }
    </style>
</head>

<body>
    <main>
        <h1>JS/TS Frontend</h1>

        {{PROJECTS}}
    </main>
</body>

</html>
